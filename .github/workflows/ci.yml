name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests unitaires
        run: make test
        working-directory: file_circulaire
      - name: Tests avec ASan et UBSan
        run: make sanitize
        working-directory: file_circulaire